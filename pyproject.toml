[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-scene-tagger"
version = "0.1.0"
description = "Writes *.scenes.json scene-marker sidecars next to videos (vault-scenes/1)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
vault-scene-tagger = "vault_scene_tagger.cli:main"

[tool.setuptools]
packages = ["vault_scene_tagger"]
